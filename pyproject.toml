[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudgraph"
version = "0.1.0"
description = "Deep graph network analytics for syndicated fraud detection"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.1", "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "joblib",
]

[project.optional-dependencies]
ml  = ["xgboost>=2.0", "gensim>=4.3"]
dl  = ["torch", "torch_geometric"]
api = ["fastapi>=0.110", "uvicorn[standard]", "pydantic>=2"]
ui  = ["streamlit>=1.30"]
db  = ["neo4j>=5.0"]
leiden = ["python-igraph", "leidenalg"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
